<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092b25">
  <title>Буковель РП — Правила</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="winter-bg" aria-hidden="true">
    <div class="aurora"></div>
    <div class="moon"></div>
    <div class="santa">🎅 🛷</div>
    <div class="forest">🎄　🌲　🎄　🌲　🎄</div>
    <div class="snowman snowman-one">⛄</div>
    <div class="snowman snowman-two">☃️</div>
    <div id="snow" class="snow"></div>
  </div>

  <main class="site-shell">
    <header class="site-header">
      <div class="brand-mark">❄</div>
      <p class="eyebrow" data-i18n="official">ОФІЦІЙНИЙ ДОВІДНИК СЕРВЕРА</p>
      <h1 data-i18n="heading">ПРАВИЛА БУКОВЕЛЬ РП</h1>
      <p class="subtitle" data-i18n="subtitle">Ознайомтеся з правилами перед грою</p>
    </header>

    <section id="language-screen" class="language-screen panel">
      <h2 data-i18n="chooseLanguage">Оберіть мову</h2>
      <p data-i18n="languageHint">Виберіть мову, якою бажаєте переглядати правила</p>
      <div class="language-actions">
        <button class="language-button" data-language="uk">🇺🇦 Українська</button>
        <button class="language-button" data-language="ru">🇷🇺 Русский</button>
      </div>
    </section>

    <section id="home-screen" class="home-screen hidden">
      <div class="top-actions">
        <button id="change-language" class="small-button" data-i18n="changeLanguage">Змінити мову</button>
      </div>
      <div class="section-grid">
        <button class="section-card" data-section="server">
          <span class="section-icon">📘</span>
          <span class="section-title" data-i18n="serverRules">Правила сервера</span>
          <span class="section-description" data-i18n="serverDescription">Загальні правила та порядок на сервері</span>
          <span class="card-arrow">→</span>
        </button>
        <button class="section-card" data-section="criminal">
          <span class="section-icon">📕</span>
          <span class="section-title" data-i18n="criminalCode">Уголовный кодекс</span>
          <span class="section-description" data-i18n="criminalDescription">Статті, порушення та покарання</span>
          <span class="card-arrow">→</span>
        </button>
      </div>
    </section>

    <section id="rules-screen" class="rules-screen panel hidden">
      <div class="rules-toolbar">
        <button id="back-home" class="small-button">← <span data-i18n="back">Назад</span></button>
        <button id="rules-language" class="small-button" data-i18n="changeLanguage">Змінити мову</button>
      </div>
      <h2 id="section-heading"></h2>
      <label class="search-wrap">
        <span>⌕</span>
        <input id="article-search" type="search" autocomplete="off" placeholder="Знайти статтю, наприклад 23.2">
      </label>
      <p id="search-help" class="search-help"></p>
      <div id="category-list" class="category-list"></div>
      <p id="empty-state" class="empty-state hidden"></p>
    </section>

    <footer class="site-footer">
      <span>❄</span>
      <span data-i18n="footer">Буковель РП · Правила сервера</span>
      <span>❄</span>
    </footer>
  </main>

  <script src="js/rules.js"></script>
  <script src="js/criminal.js"></script>
  <script src="js/translations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
